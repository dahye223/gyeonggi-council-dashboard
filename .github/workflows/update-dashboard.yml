name: 경기도의회 대시보드 자동 업데이트

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # generate.py는 표준 라이브러리만 사용한다. candidates.json이 직전과
      # 동일하면 스크립트가 아무 파일도 바꾸지 않으므로, 아래 커밋 단계의
      # `git diff --staged --quiet` 가드에 걸려 커밋·푸시(=Vercel 재배포)가
      # 일어나지 않는다. 즉 데이터가 바뀐 날에만 배포가 발생한다.
      - name: Generate dashboard
        run: python scripts/generate.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/news_state.json
          git diff --staged --quiet || git commit -m "대시보드 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push
